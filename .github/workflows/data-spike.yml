name: Data spike
# Checks every data source against the live servers and publishes the findings to the
# `data-spike` branch (spike/report.json plus sample files). Run by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/data_spike.py, .github/workflows/data-spike.yml]

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Probe the sources
        run: python tools/data_spike.py --out spike
      - name: Report findings as annotations (readable through the API)
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          rep = json.loads(pathlib.Path("spike/report.json").read_text())
          for f, x in rep.get("feeds", {}).items():
              x.pop("trace", None)
          for name in ("sample_notice.txt", "sample_lor_notice.txt"):
              p = pathlib.Path("spike") / name
              if p.exists():
                  rep[name] = p.read_text()[:2500]
          text = json.dumps(rep, default=str)
          parts = [text[i:i + 3500] for i in range(0, len(text), 3500)][:45]
          for i, chunk in enumerate(parts):
              esc = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=spike {i + 1}/{len(parts)}::{esc}")
          PY

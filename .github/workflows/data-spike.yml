name: Data spike
# Checks every data source against the live servers and publishes the findings to the
# `data-spike` branch (spike/report.json plus sample files). Run by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/data_spike.py, .github/workflows/data-spike.yml]

permissions:
  contents: write

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Probe the sources
        run: python tools/data_spike.py --out spike
      - name: Publish findings to the data-spike branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan data-spike
          git rm -rq --cached .
          git add spike
          git commit -qm "Data spike $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin data-spike

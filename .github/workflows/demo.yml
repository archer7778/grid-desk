name: Live demo
# Fetches the latest NEM data from AEMO (polite: only new files), keeps the database in the
# Actions cache between runs, and publishes a read-only snapshot to GitHub Pages.
on:
  schedule:
    - cron: "11,41 * * * *"   # about every 30 minutes (GitHub runs scheduled jobs on a best-effort basis)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [griddesk/**, web/**, data/**, .github/workflows/demo.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Restore database
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: demo
          key: griddesk-demo-${{ github.run_id }}
          restore-keys: griddesk-demo-
      - name: Unit list (once a week)
        run: |
          mkdir -p demo
          if [ ! -f demo/duids.csv ] || [ -n "$(find demo/duids.csv -mtime +7)" ]; then
            python -m griddesk.duids --out demo/duids.csv || echo "unit list unavailable; generation will show as unclassified"
          fi
          [ -f demo/duids.csv ] && cp demo/duids.csv data/duids.csv || true
      - name: Fetch new data
        if: github.event_name != 'push'
        run: python -m griddesk.fetch --config demo-config.toml
      - name: Save database
        if: github.event_name != 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: demo
          key: griddesk-demo-${{ github.run_id }}
      - name: Health report (readable through the API as annotations)
        run: |
          python - <<'PY'
          import json, time
          from griddesk.config import find_config
          from griddesk.server import App
          app = App(find_config("demo-config.toml"))
          st = app.state()
          rep = {"t": st["t"], "alerts": [a["msg"] for a in st["alerts"]][:6], "reserve": [a["reference"] for a in st["reserve"]][:4],
                 "regions": {r: {k: v.get(k) for k in ("demand", "price", "rooftop", "temp")} | {"mix": v["mix"],
                            "normal": {k: (v["normal"] or {}).get(k) for k in ("status", "samples", "need", "expected", "typical", "z", "sigma", "reason")}}
                            for r, v in st["regions"].items()},
                 "fetches": st["fetches"][:3]}
          with app.ro() as c:
              rep["rows"] = {t: c.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0] for t in ("regional", "mix", "units", "rooftop", "weather", "notices", "duids")}
              rep["span_days"] = c.execute("SELECT (MAX(t_ms)-MIN(t_ms))/86400000.0 FROM regional").fetchone()[0]
          text = json.dumps(rep, default=str)
          parts = [text[i:i + 3500] for i in range(0, len(text), 3500)][:20]
          for i, chunk in enumerate(parts):
              print(f"::notice title=health {i + 1}/{len(parts)}::" + chunk.replace("%", "%25").replace("\n", "%0A"))
          PY
      - name: Export snapshot
        run: python -m griddesk.export_static --config demo-config.toml --out site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

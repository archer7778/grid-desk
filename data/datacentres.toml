# Data-centre registry. Every entry needs a source link; the tests refuse one without.
#
# capacity_mw is ANNOUNCED capacity as the source reports it: a maximum, not what the site uses.
# Sources don't always say whether it's IT load or the grid connection; treat it as an upper bound.
# status: operating | construction | approved | proposed
# place: suburb when the source names one; otherwise "metro" (shown at the city, marked approximate).
#
# Compiled 2026-10-17 from RenewMap's public project pages, which aggregate operator announcements
# and planning documents. Corrections welcome: open an issue with a better source.

[[source]]
id = "renewmap-nsw"
title = "RenewMap: NSW data centre projects"
url = "https://renewmap.com.au/resources/projects/nsw/datacentre/"
accessed = "2026-10-17"

